services:
  - type: web
    name: subtool
    runtime: python
    buildCommand: pip install -r requirements.txt && apt-get update && apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-vie
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: 8000
